name: Gauges daily refresh

# Weekdays after the US cash equity close (approx 22:30 UTC = 5:30 PM ET / 6:30 PM EDT).
# Rebuilds the active gauge set and commits data/gauges.json only when values change.
# The model list lives in scripts/build_gauges.py. Retired gauges (Mean Reversion / meanrev,
# Price/Sales / ps) are not rebuilt and are not restored from the previous JSON on this
# daily run or on the monthly full rebuild.
# data/gauge_signal_history.json is append-only: the builder keeps prior readings, skips
# a partial or failed rebuild, and does not replace a date already stored. Commit it
# together with data/gauges.json. No secrets or paid services.
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gauges-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet xlrd openpyxl

      - name: Build gauges.json
        run: python3 scripts/build_gauges.py --daily

      - name: Commit if changed
        run: |
          git add data/gauges.json data/gauge_signal_history.json
          if git diff --cached --quiet; then
            echo "UNCHANGED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(gauges): daily data refresh"
          git push
